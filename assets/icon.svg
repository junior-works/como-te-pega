<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cómo Te Pega" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <!-- Cómo Te Pega — ícono base 512x512. Misma forma (dos ondas + punto).
         Identidad argentina: onda externa celeste, onda interna blanca, sol amarillo. -->
    <rect width="512" height="512" fill="#0a0a0c"/>
    <path d="M 76 320 A 180 180 0 0 1 436 320"
          fill="none" stroke="#74ACDF" stroke-width="46" stroke-linecap="round"/>
    <path d="M 130 320 A 126 126 0 0 1 382 320"
          fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    <circle cx="256" cy="320" r="54" fill="#F6B40E"/>
</svg>
